housing_eligibility:            # against King County income limits, eff. 2025-04-01
  household_size_used: 1
  income_measured: 67265
  king_county_caps_1_person:
    ami_30: 33050
    ami_50: 55000
    ami_60: 66000
    ami_80: 84150
  king_county_caps_2_person:
    ami_30: 37750
    ami_50: 62850
    ami_60: 75420
    ami_80: 96150
  verdicts:
    hud_section_202:
      qualifies: false
      why: Needs ≤50% AMI ($55,000). Over by ~$12,265.
    project_based_section_8:
      qualifies: false
      why: Targets ≤50% AMI in practice. Legally under the 80% ceiling, but realistically no.
    kcha_subsidized:
      qualifies: true
      priority: low
      why: Under the 80% AMI admission ceiling ($84,150), but units target ≤50% AMI and many waitlists are closed. Backup only.
    lihtc_tax_credit:
      qualifies: false
      margin: Over the 60% AMI line ($66,000) by only $1,265
      action: CALL EACH BUILDING. Two things can flip this to yes —
              (a) a 2-person household raises the cap to $75,420,
              (b) buildings count countable income differently.
    arch_income_restricted:
      qualifies: true
      tier: 80% AMI tier only (not the 60% tier)
      action: Ask Reunion at Redmond Ridge which AMI tier each open unit is set at.
    market_rate_senior:
      qualifies: true
      why: No income cap. Most reliable path.
      affordable_examples:
        - Brandenwood Senior Apartments (Bellevue) — 62+, $1,655+
        - Crossroads Active Senior Community / SHAG (Bellevue) — 55+, $1,750–2,500
        - Reunion at Redmond Ridge — the 36 non-ARCH market units
        - Park Plaza Apartments (Bellevue) — 55+, $3,700 (large share of monthly income)
  residency_requirement:
    required: false
    detail: >-
      No length-of-residency requirement — KCHA confirms you can apply from
      anywhere. Some waitlists give a local preference, which affects how fast
      you get in, not whether you qualify. Residency is not a barrier; income is.

